<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BerlinMed</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>

        <div class="container">

            <div class="logo">

                <i class="fa-solid fa-heart-pulse"></i>
                <h2>BerlinMed</h2>

            </div>

            <nav>

                <ul>

                    <li><a href="/">Home</a></li>
                    <li><a href="/products">Products</a></li>
                    <li><a href="/contact">Contact Us</a></li>
                    <li><a href="/login">Login</a></li>

                </ul>

            </nav>

            <div class="icons">
                <a href="/cart" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
                <a href="/login" title="Login">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>

            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>

    <section class="login-page">

        <div class="login-box">

            <h2>Create a New Account</h2>

            <form onsubmit="return registerUser(event)">

                <div class="input-box">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter your username" id="reg-username" required>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="example@email.com" id="reg-email" required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="********" id="reg-password" required>
                </div>

                <button type="submit">Create Account</button>

                <p>
                    Already have an account?
                    <a href="/login">Login</a>
                </p>

            </form>

        </div>

    </section>

    <script src="/static/js/api.js"></script>
    <script src="/script.js"></script>
    <script>
        async function registerUser(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const { ok, data } = await API.register(username, email, password);

            if (ok) {
                alert('Account created successfully for ' + username + '! You can now login.');
                window.location.href = '/login';
            } else {
                alert(data.error || 'Registration failed');
            }
            return false;
        }
    </script>
</body>

</html>
