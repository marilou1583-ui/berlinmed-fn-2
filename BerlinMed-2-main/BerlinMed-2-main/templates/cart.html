<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | BerlinMed</title>

<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <h2>BerlinMed</h2>
            </div>

            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/products" class="active">Products</a></li>
                    <li><a href="/about">About Us</a></li>
                    <li><a href="/contact">Contact Us</a></li>
                </ul>
            </nav>

            <div class="icons">
                <a href="/cart" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
                <a href="/login" title="Login">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>

            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section class="cart-page">

        <div class="container">

            <h1>Shopping Cart</h1>

            <table class="cart-table">

                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Remove</th>
                    </tr>
                </thead>

                <tbody id="cart-items">
                </tbody>

            </table>

            <div class="cart-summary" id="cart-summary">
                <h2>Grand Total</h2>
                <h3 id="cart-total">0.00 USD</h3>
                <div style="display: grid; gap: 10px; margin: 20px 0;">
                    <input type="text" id="checkout-customer-name" placeholder="Full name" maxlength="100" required>
                    <input type="tel" id="checkout-phone" placeholder="Phone number" maxlength="50" required>
                    <textarea id="checkout-shipping-address" placeholder="Shipping address" required></textarea>
                </div>
                <a href="#" class="buy-btn" onclick="return checkout()">Checkout</a>
            </div>

            <div id="empty-cart" style="display: none; text-align: center; padding: 60px 20px;">
                <i class="fas fa-shopping-cart" style="font-size: 64px; color: #ddd; margin-bottom: 20px;"></i>
                <h2>Your cart is empty</h2>
                <p>Browse our products and add items to your cart.</p>
                <a href="/products" class="btn" style="margin-top: 20px;">Browse Products</a>
            </div>

        </div>

    </section>

    <script src="/static/js/api.js"></script>
    <script src="/script.js"></script>
    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const tbody = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const summaryEl = document.getElementById('cart-summary');
            const emptyEl = document.getElementById('empty-cart');

            if (cart.length === 0) {
                tbody.innerHTML = '';
                summaryEl.style.display = 'none';
                emptyEl.style.display = 'block';
                return;
            }

            summaryEl.style.display = 'block';
            emptyEl.style.display = 'none';

            let grandTotal = 0;

            tbody.innerHTML = cart.map((item, index) => {
                const itemTotal = item.price * (item.quantity || 1);
                grandTotal += itemTotal;
                return `
                    <tr>
                        <td>
                            <img src="${escapeHtml(getImageUrl(item.image))}" alt="${escapeHtml(item.name)}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td>${escapeHtml(item.name)}</td>
                        <td>${item.price.toFixed(2)} USD</td>
                        <td>
                            <input type="number" value="${item.quantity || 1}" min="1" style="width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px;" onchange="updateCartQuantity(${index}, this.value)">
                        </td>
                        <td>${itemTotal.toFixed(2)} USD</td>
                        <td>
                            <a href="#" onclick="return removeFromCart(${index})" style="color: #d62828;">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');

            totalEl.textContent = grandTotal.toFixed(2) + ' USD';
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
            return false;
        }

        function updateCartQuantity(index, qty) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart[index]) {
                cart[index].quantity = Math.max(1, parseInt(qty) || 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
            }
        }

        async function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return false;
            }

            const items = cart.map(item => ({ id: item.id, quantity: item.quantity || 1 }));
            const customerName = document.getElementById('checkout-customer-name').value.trim();
            const phone = document.getElementById('checkout-phone').value.trim();
            const shippingAddress = document.getElementById('checkout-shipping-address').value.trim();
 
            if (!customerName || !phone || !shippingAddress) {
                alert('Please provide your name, phone number and shipping address.');
                return false;
            }
 
            const idempotencyKey = sessionStorage.getItem('checkout_idempotency_key') ||
                (window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
            sessionStorage.setItem('checkout_idempotency_key', idempotencyKey);
            const { ok, data } = await API.createOrder(items, {
                customer_name: customerName,
                phone,
                shipping_address: shippingAddress
            }, idempotencyKey);
 
            if (ok) {
                alert('Thank you for your order!');
                localStorage.removeItem('cart');
                sessionStorage.removeItem('checkout_idempotency_key');
                loadCart();
            } else {
                alert(data.error || 'Could not place order. Please try again.');
            }
            return false;
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>

</html>
