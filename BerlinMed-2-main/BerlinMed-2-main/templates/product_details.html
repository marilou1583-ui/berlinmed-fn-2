<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | BerlinMed</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/c4254e24a8.js" crossorigin="anonymous"></script>
</head>

<body>

    <header>
        <div class="container header-container">
            <div class="header-top">
                <div class="logo">
                    <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                        <i class="fa-solid fa-heart-pulse"></i>
                        <h2 style="color: #fff;">BerlinMed</h2>
                    </a>
                </div>
                <div class="icons">
                    <a href="/cart" title="Shopping Cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </a>
                    <a href="/login" title="Login">
                        <i class="fa-solid fa-user"></i>
                    </a>
                </div>
            </div>
            <div class="header-bottom">
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/products">Products</a></li>
                        <li><a href="/about">About Us</a></li>
                        <li><a href="/contact">Contact Us</a></li>
                    </ul>
                </nav>
            </div>
            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section class="product-details-section">
        <div class="container">
            <div class="product-details-grid" id="product-details-content">
                <div style="text-align: center; padding: 60px 20px; color: #666;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 48px; margin-bottom: 20px;"></i>
                    <p>Loading product details...</p>
                </div>
            </div>
        </div>
    </section>

    <div class="copyright" style="background: #0f172a; color: #fff; margin-top: 50px; padding: 20px; text-align: center;">
        <p>© 2026 BerlinMed. All Rights Reserved.</p>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/script.js"></script>
    <script>
        // Load product details from API
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                document.getElementById('product-details-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #666;">
                        <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 20px;"></i>
                        <h2>Product not found</h2>
                        <p>No product ID provided.</p>
                        <a href="/products" class="btn" style="margin-top: 20px;">Back to Products</a>
                    </div>
                `;
                return;
            }

            const { ok, data } = await API.getProduct(productId);

            if (!ok || !data) {
                document.getElementById('product-details-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #666;">
                        <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 20px;"></i>
                        <h2>Product not found</h2>
                        <p>The product you're looking for doesn't exist.</p>
                        <a href="/products" class="btn" style="margin-top: 20px;">Back to Products</a>
                    </div>
                `;
                return;
            }

            document.title = data.name + ' | BerlinMed';

            const images = (data.images && data.images.length > 0)
                ? data.images.map(img => img.filename)
                : [data.image];

            document.getElementById('product-details-content').innerHTML = `
                <div class="product-details-image">
                    <div class="product-details-main-image">
                        <img id="main-product-image" src="${getImageUrl(images[0])}" alt="${escapeHtml(data.name)}">
                    </div>
                    ${images.length > 1 ? `
                        <div class="product-details-thumbnails">
                            ${images.map((img, index) => `
                                <img src="${getImageUrl(img)}" data-index="${index}" class="${index === 0 ? 'active' : ''}" alt="${escapeHtml(data.name)} ${index + 1}">
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
                <div class="product-details-content">
                    <h1>${escapeHtml(data.name)}</h1>
                    <p class="product-description">${escapeHtml(data.description)}</p>
                    <div class="product-price">${data.price.toFixed(2)} USD</div>
                    <div class="product-actions">
                        <input type="number" value="1" min="1" class="quantity-input" id="detail-quantity" aria-label="Quantity">
                        <a href="#" class="btn btn-primary" id="add-to-cart-btn">Add to Cart</a>
                    </div>
                </div>
            `;

            const thumbnailsContainer = document.querySelector('.product-details-thumbnails');
            if (thumbnailsContainer) {
                thumbnailsContainer.addEventListener('click', (event) => {
                    const thumb = event.target.closest('img');
                    if (!thumb) return;
                    const index = Number(thumb.dataset.index);
                    document.getElementById('main-product-image').src = getImageUrl(images[index]);
                    thumbnailsContainer.querySelectorAll('img').forEach(el => el.classList.remove('active'));
                    thumb.classList.add('active');
                });
            }

            document.getElementById('add-to-cart-btn').addEventListener('click', (event) => {
                event.preventDefault();
                addToCart(data);
            });
        });

        function addToCart(product) {
            const qtyInput = document.getElementById('detail-quantity');
            const qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 0) + qty;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, image: product.image, quantity: qty });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Product added to cart!');
        }
    </script>
</body>

</html>
