<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="">
    <title>Admin Dashboard | BerlinMed</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            margin: 0;
        }

        .admin-dashboard {
            min-height: 100vh;
            background-color: #f5f7fa;
        }
 
        .admin-header {
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
 
        .admin-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
 
        .admin-header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
 
        .admin-container {
            display: grid;
            grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
            min-height: calc(100vh - 80px);
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }
 
        .admin-sidebar {
            background: white;
            border-right: 1px solid #eee;
            padding: 20px;
            min-width: 0;
            width: 100%;
            max-width: 100%;
        }
 
        .admin-sidebar h2 {
            color: #0084d6;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
 
        .admin-nav {
            list-style: none;
            padding: 0;
        }
 
        .admin-nav li {
            margin-bottom: 15px;
        }
 
        .admin-nav li a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            text-decoration: none;
            color: #333;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
            white-space: normal;
            word-break: break-word;
        }
 
        .admin-nav li a:hover {
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
        }
 
        .admin-nav li a i {
            margin-right: 12px;
            width: 20px;
        }
 
        .admin-nav li.active a {
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
        }
 
        .admin-main {
            padding: 30px;
            background-color: #f5f7fa;
            min-width: 0;
            overflow-x: hidden;
            max-width: 100%;
        }

        .admin-main > .container,
        .admin-header .container {
            width: 100%;
            max-width: 100%;
            padding: 0 10px;
        }
 
        .admin-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
 
        .admin-title h2 {
            color: #333;
            font-size: 24px;
            margin: 0;
        }
 
        .admin-btn {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
 
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,132,214,0.4);
        }
 
        .admin-btn i {
            margin-right: 8px;
        }
 
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
 
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-top: 4px solid;
        }
 
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
 
        .stat-card.products { border-top-color: #0084d6; }
        .stat-card.orders { border-top-color: #00a651; }
        .stat-card.users { border-top-color: #ff9f1c; }
        .stat-card.revenue { border-top-color: #d62828; }
 
        .stat-icon {
            font-size: 28px;
            margin-bottom: 15px;
        }
 
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin: 10px 0;
        }
 
        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
 
        .products-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
 
        .table-header {
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
 
        .table-header h3 {
            margin: 0;
            font-size: 20px;
        }
 
        .table-header .admin-btn {
            background: rgba(255,255,255,0.2);
        }
 
        .table-header .admin-btn:hover {
            background: rgba(255,255,255,0.3);
        }
 
        table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
        }
 
        th, td {
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
 
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
 
        tr:hover {
            background-color: #f5f7fa;
        }
 
        .product-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
 
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
 
        .product-info {
            display: flex;
            align-items: center;
        }
 
        .product-details {
            flex-grow: 1;
            margin-left: 15px;
        }
 
        .product-details h4 {
            margin: 0 0 5px 0;
            color: #333;
        }
 
        .product-details p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
 
        .price-tag {
            background: #00a651;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }
 
        .action-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
 
        .action-btn {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
 
        .edit-btn {
            background: #0084d6;
            color: white;
        }
 
        .edit-btn:hover {
            background: #006bb5;
        }
 
        .delete-btn {
            background: #d62828;
            color: white;
        }
 
        .delete-btn:hover {
            background: #a71e1e;
        }
 
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
 
        .no-data i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ddd;
        }
 
        @media (max-width: 768px) {
            .admin-container {
                grid-template-columns: 1fr;
            }
 
            .admin-sidebar {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
 
            .admin-title {
                flex-direction: column;
                align-items: flex-start;
            }
 
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
 
        @media (max-width: 480px) {
            .admin-main {
                padding: 15px;
            }

            .admin-header h1 {
                font-size: 22px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
 
            th, td {
                padding: 12px 10px;
            }

            .action-btns {
                flex-direction: column;
                align-items: stretch;
            }

            .action-btn {
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>
 
<body>
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-content">
                <h1><i class="fas fa-tachometer-alt"></i> BerlinMed Admin Dashboard</h1>
                <p>Manage your medical supplies store</p>
            </div>
        </div>
    </header>
 
    <div id="flash-messages" style="display: none; max-width: 1200px; margin: 20px auto 0; padding: 0 20px;"></div>
 
    <div class="admin-container">
        <aside class="admin-sidebar">
            <h2><i class="fas fa-hospital"></i> Admin Panel</h2>
            <ul class="admin-nav">
                <li class="active"><a href="/admin"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="/admin/add"><i class="fas fa-plus-circle"></i> Add Product</a></li>
                <li><a href="/admin/content"><i class="fas fa-file-lines"></i> Manage Content</a></li>
                <li><a href="/products"><i class="fas fa-box"></i> View Products</a></li>
                <li><a href="#" onclick="return handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
 
        <main class="admin-main">
            <div class="container">
                <div class="admin-title">
                    <h2><i class="fas fa-tachometer-alt"></i> Dashboard Overview</h2>
                    <a href="/admin/add" class="admin-btn">
                        <i class="fas fa-plus"></i> Add New Product
                    </a>
                </div>
 
                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card products">
                        <div class="stat-icon"><i class="fas fa-box"></i></div>
                        <div class="stat-number" id="total-products">0</div>
                        <div class="stat-label">Total Products</div>
                    </div>
                    <div class="stat-card orders">
                        <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
                        <div class="stat-number" id="total-orders">0</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-user"></i></div>
                        <div class="stat-number">120</div>
                        <div class="stat-label">Customers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
                        <div class="stat-number" id="total-revenue">0 USD</div>
                        <div class="stat-label">Revenue</div>
                    </div>
                </div>
 
                <div class="products-table">
                    <div class="table-header">
                        <h3><i class="fas fa-box-open"></i> Product Management</h3>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th colspan="4">
                                        <input type="text" id="product-search" placeholder="Search products by name..." style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; outline:none;">
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="products-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
 
    <script src="/static/js/api.js"></script>
    <script src="/script.js"></script>
    <script>
        async function handleLogout() {
            const { ok } = await API.logout();
            if (ok) {
                window.location.href = '/login';
            }
            return false;
        }
 
        function showFlash(message) {
            const el = document.getElementById('flash-messages');
            el.style.display = 'block';
            el.innerHTML = `
                <div style="padding: 15px 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid; background: #d4edda; color: #155724; border-left-color: #28a745; font-weight: 500;">
                    <i class="fas fa-check-circle"></i> ${message}
                </div>
            `;
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
 
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            const { ok, data } = await API.deleteProduct(id);
            if (ok) {
                showFlash(data.message || 'Product deleted successfully!');
                loadDashboard();
            } else {
                alert(data.error || 'Failed to delete product');
            }
        }
 
        let loadedProducts = [];

        async function loadDashboard() {
            // Check session
            const sessionRes = await API.checkSession();
            if (!sessionRes.data.admin) {
                window.location.href = '/login';
                return;
            }
 
            const productsRes = await API.getProducts();
            const ordersRes = await API.getOrders();
 
            const products = productsRes.data || [];
            const orders = ordersRes.data || [];
 
            loadedProducts = products;
 
            // Update stats
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('total-orders').textContent = orders.length;
 
            const totalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
            document.getElementById('total-revenue').textContent = totalRevenue.toFixed(2) + ' USD';
 
            renderProductsTable(products);
 
            const searchInput = document.getElementById('product-search');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim().toLowerCase();
                const filtered = loadedProducts.filter(p => p.name.toLowerCase().startsWith(query));
                renderProductsTable(filtered);
            });
        }
 
        function renderProductsTable(products) {
            const tbody = document.getElementById('products-table-body');
 
            if (products.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-data">
                            <i class="fas fa-box-open"></i>
                            <p>No products found. Add your first product to get started.</p>
                            <a href="/admin/add" class="admin-btn">
                                <i class="fas fa-plus"></i> Add Product
                            </a>
                        </td>
                    </tr>
                `;
                return;
            }
 
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>
                        <div class="product-image">
                            <img src="${escapeHtml(getImageUrl(p.image))}" alt="${escapeHtml(p.name)}">
                        </div>
                    </td>
                    <td>
                        <div class="product-info">
                            <div class="product-details">
                                <h4>${escapeHtml(p.name)}</h4>
                                <p>${escapeHtml((p.description || '').substring(0, 50))}${(p.description || '').length > 50 ? '...' : ''}</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="price-tag">${p.price.toFixed(2)} USD</span>
                    </td>
                    <td>
                        <div class="action-btns">
                            <a href="/admin/edit?id=${p.id}" class="action-btn edit-btn">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a href="#" class="action-btn delete-btn" onclick="return deleteProduct(${p.id})">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
 
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
 
</html>
